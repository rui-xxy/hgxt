<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>恒光化工品牌短片</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    canvas { display: block; width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>
  <canvas id="c" width="1920" height="1080" aria-hidden="true"></canvas>
  <script src="./reel.js"></script>
  <script>
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    let animationFrame;
    let startedAt = 0;
    let pausedAt = 0;
    let lastPaint = 0;

    function tick(now) {
      if (document.hidden) {
        animationFrame = requestAnimationFrame(tick);
        return;
      }
      if (!startedAt) startedAt = now;
      if (now - lastPaint >= 1000 / 30) {
        const frame = Math.min(window.TOTAL - 1, Math.floor((now - startedAt) * 60 / 1000));
        window.renderAt(frame);
        lastPaint = now;
        if (frame >= window.TOTAL - 1) return;
      }
      animationFrame = requestAnimationFrame(tick);
    }

    window.ready.then(() => {
      window.renderAt(reducedMotion.matches ? window.TOTAL - 1 : 0);
      if (!reducedMotion.matches) animationFrame = requestAnimationFrame(tick);
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) pausedAt = performance.now();
      else if (pausedAt && startedAt) {
        startedAt += performance.now() - pausedAt;
        pausedAt = 0;
      }
    });
    addEventListener('pagehide', () => cancelAnimationFrame(animationFrame));
  </script>
</body>
</html>
