<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>恒光化工品牌动画</title>
<style>html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}canvas{display:block;width:100%;height:100%;object-fit:cover}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="logo.js"></script>
<script>
// =====================================================================
//  HENGGUANG CHEMICAL — 25s MOTION FILM  (deterministic: renderFrame(t))
// =====================================================================
const W=1920,H=1080,CX=960,CY=540,TAU=Math.PI*2,DUR=25;
const cv=document.getElementById('c'), X=cv.getContext('2d');
const mk=(w=W,h=H)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const LA=mk(),LB=mk(),LC=mk(),TMP=mk(),TMP2=mk(),B1=mk(480,270),B2=mk(240,135);
const la=LA.getContext('2d'),lb=LB.getContext('2d'),lc=LC.getContext('2d'),tm=TMP.getContext('2d'),tm2=TMP2.getContext('2d'),b1=B1.getContext('2d'),b2=B2.getContext('2d');

// ---------- math ----------
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x, lerp=(a,b,t)=>a+(b-a)*t, rng=(t,a,b)=>clamp((t-a)/(b-a));
const fract=x=>x-Math.floor(x), hash=n=>fract(Math.sin(n*127.1+311.7)*43758.5453123);
const E={lin:t=>t,inQ:t=>t*t,outQ:t=>1-(1-t)*(1-t),inC:t=>t*t*t,outC:t=>1-Math.pow(1-t,3),
 ioC:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, outQn:t=>1-Math.pow(1-t,5),
 ioQt:t=>t<.5?8*t*t*t*t:1-Math.pow(-2*t+2,4)/2,
 inX:t=>t<=0?0:Math.pow(2,10*t-10), outX:t=>t>=1?1:1-Math.pow(2,-10*t),
 ioX:t=>t<=0?0:t>=1?1:t<.5?Math.pow(2,20*t-10)/2:(2-Math.pow(2,-20*t+10))/2,
 outB:t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);},
 outB2:t=>{const c1=2.4,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);},
 outEl:t=>t<=0?0:t>=1?1:Math.pow(2,-9*t)*Math.sin((t*9-0.75)*(TAU/3))+1};
const ez=(t,a,b,f=E.outX)=>f(rng(t,a,b));

// ---------- palette / type ----------
const F={cn:'"Noto Sans CJK SC", "Microsoft YaHei", sans-serif',num:'"Inter Display", Arial, sans-serif',ui:'"Inter", Arial, sans-serif',mono:'"DejaVu Sans Mono", Consolas, monospace'};
const GSTOPS=[[0,[10,127,214]],[0.25,[5,150,204]],[0.45,[4,168,164]],[0.65,[12,180,122]],[0.82,[47,185,92]],[1,[120,196,54]]];
function gcol(u,a=1){u=clamp(u);for(let i=1;i<GSTOPS.length;i++){if(u<=GSTOPS[i][0]){const[p0,c0]=GSTOPS[i-1],[p1,c1]=GSTOPS[i];const k=(u-p0)/(p1-p0);return `rgba(${c0[0]+(c1[0]-c0[0])*k|0},${c0[1]+(c1[1]-c0[1])*k|0},${c0[2]+(c1[2]-c0[2])*k|0},${a})`;}}return 'rgba(120,196,54,'+a+')';}
function brandGrad(c,x0,y0,x1,y1,a=1){const g=c.createLinearGradient(x0,y0,x1,y1);for(const[s] of GSTOPS)g.addColorStop(s,gcol(s,a));return g;}
const setF=(c,w,s,fam)=>{c.font=`${w} ${s}px ${fam}`;};

// ---------- text helpers ----------
function layout(c,str,ls){c.letterSpacing='0px';let x=0;const ch=[];for(const s of [...str]){const w=c.measureText(s).width;ch.push({s,x,w});x+=w+ls;}return{ch,w:Math.max(0,x-ls)};}
function txt(c,str,x,y,o){ // o: w,s,fam,color,ls,align,alpha
  setF(c,o.w||400,o.s,o.fam||F.cn);c.textAlign='left';c.textBaseline='alphabetic';
  const L=layout(c,str,o.ls||0);const x0=o.align==='center'?x-L.w/2:o.align==='right'?x-L.w:x;
  c.save();c.globalAlpha*=(o.alpha??1);c.fillStyle=o.color||'#fff';
  if(!o.ls){c.fillText(str,x0,y);}else for(const k of L.ch)c.fillText(k.s,x0+k.x,y);
  c.restore();return{x0,w:L.w};}
function reveal(c,str,x,y,t,o){ // per-char masked rise. o: w,s,fam,color,ls,align,st,dur,out,alpha
  setF(c,o.w||900,o.s,o.fam||F.cn);c.textAlign='left';c.textBaseline='alphabetic';
  const L=layout(c,str,o.ls||0);const x0=o.align==='center'?x-L.w/2:o.align==='right'?x-L.w:x;
  const st=o.st??0.04,dur=o.dur??0.6,n=L.ch.length,out=o.out||0;
  if(t<=0&&!out)return{x0,w:L.w};
  const ga=c.globalAlpha;c.save();c.beginPath();c.rect(x0-o.s,y-o.s*1.18,L.w+o.s*2,o.s*1.48);c.clip();c.fillStyle=o.color||'#fff';
  L.ch.forEach((k,i)=>{const p=(o.ease||E.outX)(rng(t,i*st,i*st+dur));if(p<=0)return;
    const po=E.inC(clamp(out*1.7-(i/n)*0.7));if(po>=1)return;
    c.globalAlpha=ga*(o.alpha??1)*clamp(p*1.6)*(1-po);
    c.fillText(k.s,x0+k.x,y+(1-p)*o.s*1.1-po*o.s*1.15);});
  c.restore();return{x0,w:L.w};}
const GLY='ABCDEFGHJKLMNPQRSTUVWXYZ0123456789#%&*+=<>/';
function scr(str,p,seed=0){if(p>=1)return str;let o='';const n=str.length;for(let i=0;i<n;i++){const ch=str[i];if(ch===' '){o+=' ';continue;}const th=i/n;
  if(p>th*0.8+0.2)o+=ch;else if(p>th*0.8-0.05)o+=GLY[Math.floor(hash(i*13.7+seed+Math.floor(p*48)*3.1)*GLY.length)];else o+=' ';}return o;}
function mono(c,str,x,y,o){return txt(c,str,x,y,{w:o.w||700,s:o.s||16,fam:F.mono,color:o.color||'rgba(170,220,255,0.75)',ls:o.ls??3,align:o.align||'left',alpha:o.alpha??1});}
function label(c,str,x,y,t,o={}){ // scrambled mono label, t=progress start-relative seconds
  const p=clamp(t/(o.dur||0.6));if(p<=0)return;const out=o.out||0;mono(c,scr(str,p,o.seed||1),x,y,{...o,alpha:(o.alpha??1)*(1-out)*clamp(p*3)});}
function fixedNum(c,str,x,y,o){ // tabular digits
  setF(c,o.w||900,o.s,o.fam||F.num);c.textAlign='center';c.textBaseline='alphabetic';c.letterSpacing='0px';
  const slot=c.measureText('0').width*(o.track??1.0);let W2=0;for(const ch of str)W2+=(ch===','||ch==='.')?slot*0.42:slot;
  let xx=o.align==='center'?x-W2/2:o.align==='right'?x-W2:x;c.fillStyle=o.color||'#fff';
  for(const ch of str){const sw=(ch===','||ch==='.')?slot*0.42:slot;c.fillText(ch,xx+sw/2,y);xx+=sw;}return{x0:o.align==='center'?x-W2/2:o.align==='right'?x-W2:x,w:W2};}
function formula(c,str,x,y,s,o={}){ // digits as subscript
  const tokens=[];for(const ch of str){const sub=/[0-9₂₃₄]/.test(ch);tokens.push({ch:sub?({'₂':'2','₃':'3','₄':'4'}[ch]||ch):ch,sub});}
  let w=0;const ms=[];for(const k of tokens){setF(c,o.w||800,k.sub?s*0.6:s,F.num);const m=c.measureText(k.ch).width;ms.push(m);w+=m+(k.sub?1:0);}
  let xx=o.align==='left'?x:o.align==='right'?x-w:x-w/2;c.textAlign='left';c.fillStyle=o.color||'#fff';c.letterSpacing='0px';
  tokens.forEach((k,i)=>{setF(c,o.w||800,k.sub?s*0.6:s,F.num);c.fillText(k.ch,xx,y+(k.sub?s*0.2:0));xx+=ms[i]+(k.sub?1:0);});return w;}

// ---------- drawing helpers ----------
function radial(c,x,y,r,col,a=1){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');c.save();c.globalAlpha*=a;c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2);c.restore();}
function hexPath(c,x,y,r,rot=0){c.beginPath();for(let i=0;i<6;i++){const a=rot+i*TAU/6-Math.PI/2;const px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;i?c.lineTo(px,py):c.moveTo(px,py);}c.closePath();}
function brackets(c,x,y,w,h,len,p,col,lw=2){if(p<=0)return;const l=len*p;c.save();c.strokeStyle=col;c.lineWidth=lw;c.beginPath();
  c.moveTo(x,y+l);c.lineTo(x,y);c.lineTo(x+l,y);c.moveTo(x+w-l,y);c.lineTo(x+w,y);c.lineTo(x+w,y+l);
  c.moveTo(x+w,y+h-l);c.lineTo(x+w,y+h);c.lineTo(x+w-l,y+h);c.moveTo(x+l,y+h);c.lineTo(x,y+h);c.lineTo(x,y+h-l);c.stroke();c.restore();}
function para(c,cx,cy,w,h,sk=0.238){const hw=w/2,hh=h/2;c.beginPath();c.moveTo(cx-hw+sk*hh,cy-hh);c.lineTo(cx+hw+sk*hh,cy-hh);c.lineTo(cx+hw-sk*hh,cy+hh);c.lineTo(cx-hw-sk*hh,cy+hh);c.closePath();}
function partialPoly(c,pts,p){ // draw first p fraction of polyline
  let L=0;const seg=[];for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(d);L+=d;}
  let rem=L*clamp(p);c.beginPath();c.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length&&rem>0;i++){const d=seg[i-1];if(rem>=d){c.lineTo(pts[i][0],pts[i][1]);rem-=d;}else{const k=rem/d;c.lineTo(lerp(pts[i-1][0],pts[i][0],k),lerp(pts[i-1][1],pts[i][1],k));rem=0;}}}
function qpts(x0,y0,cx,cy,x1,y1,n=40){const a=[];for(let i=0;i<=n;i++){const t=i/n,u=1-t;a.push([u*u*x0+2*u*t*cx+t*t*x1,u*u*y0+2*u*t*cy+t*t*y1]);}return a;}
function glowDot(c,x,y,r,col,a=1){c.save();c.globalCompositeOperation='lighter';radial(c,x,y,r*5,col,0.55*a);c.globalAlpha=a;c.fillStyle='#fff';c.beginPath();c.arc(x,y,r,0,TAU);c.fill();c.restore();}

// ---------- precomputed layers ----------
const DOTS=mk(W+160,H+160);{const d=DOTS.getContext('2d');d.fillStyle='#fff';for(let y=0;y<H+160;y+=40)for(let x=0;x<W+160;x+=40)d.fillRect(x,y,2,2);}
function dotGrid(c,ox,oy,a){if(a<=0)return;c.save();c.globalAlpha=a;c.drawImage(DOTS,-80+(((ox%40)+40)%40),-80+(((oy%40)+40)%40));c.restore();}
const VIG=mk();{const v=VIG.getContext('2d');const g=v.createRadialGradient(CX,CY,380,CX,CY,1180);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.78)');v.fillStyle=g;v.fillRect(0,0,W,H);}
const GRAIN=[0,1,2].map(k=>{const g=mk(960,540),gc=g.getContext('2d'),id=gc.createImageData(960,540);for(let i=0;i<id.data.length;i+=4){const v=128+(Math.random()-0.5)*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255;}gc.putImageData(id,0,0);return g;});
const HEXBG=mk(2400,2400);{const h=HEXBG.getContext('2d');h.strokeStyle='#fff';h.lineWidth=1.2;const r=46,dx=r*Math.sqrt(3),dy=r*1.5;for(let j=-1;j<2400/dy+1;j++)for(let i=-1;i<2400/dx+1;i++){hexPath(h,i*dx+(j%2?dx/2:0),j*dy,r);h.stroke();}}
const DUST=[...Array(150)].map((_,i)=>({x:hash(i)*W,y:hash(i+500)*H,z:0.3+hash(i+900)*1.7,s:hash(i+1300)}));
function dust(c,t,col,a){if(a<=0)return;c.save();c.fillStyle=col;for(const d of DUST){const x=((d.x+t*14*d.z)%W+W)%W,y=((d.y-t*22*d.z)%H+H)%H,r=0.8+d.z*1.3;c.globalAlpha=a*(0.2+0.8*d.s)*(0.55+0.45*Math.sin(t*2.3+d.s*20));c.fillRect(x,y,r,r);}c.restore();}
function bgBase(c,col='#02070f'){c.globalCompositeOperation='source-over';c.globalAlpha=1;c.setTransform(1,0,0,1,0,0);c.fillStyle=col;c.fillRect(0,0,W,H);}

// =====================================================================
// SCENE 1 — ORIGIN : sulfur element  (0 – 2.5)
// =====================================================================
const S1P=[...Array(170)].map((_,i)=>({a:hash(i+1)*TAU,r0:480+hash(i+7)*760,per:0.75+hash(i+11)*1.0,ph:hash(i+17),w:0.6+hash(i+23)*1.8,col:hash(i+29)}));
function S1(c,t){
  bgBase(c,'#010308');
  const on=ez(t,0.28,1.1,E.outC),TY=480;
  radial(c,CX,TY,1050,'rgba(255,160,20,0.17)',on);radial(c,CX,TY,430,'rgba(255,214,80,0.16)',on);
  dotGrid(c,t*8,t*14,0.055*on);dust(c,t,'#ffd870',0.5*on);
  // spark & flare before ignition
  if(t<0.7){const fp=E.outX(rng(t,0,0.32)),fa=1-rng(t,0.3,0.7);c.save();c.globalCompositeOperation='lighter';
    const g=c.createLinearGradient(CX-700*fp,0,CX+700*fp,0);g.addColorStop(0,'rgba(255,200,60,0)');g.addColorStop(0.5,`rgba(255,240,180,${0.9*fa})`);g.addColorStop(1,'rgba(255,200,60,0)');
    c.fillStyle=g;c.fillRect(CX-700*fp,TY-1.5,1400*fp,3);glowDot(c,CX,TY,3+2*Math.sin(t*40),'rgba(255,210,80,1)',fa);c.restore();}
  const zin=E.inX(rng(t,1.98,2.5));const z=(1.1-0.1*ez(t,0.3,2.0,E.outC))*(1+8*zin);
  c.save();c.translate(CX,TY);c.scale(z,z);c.translate(-CX,-TY);
  if(t>0.28){c.save();c.globalCompositeOperation='lighter';
    for(const p of S1P){const u=fract((t-0.28)/p.per+p.ph);const r=p.r0*Math.pow(1-u,1.7);if(r<175)continue;const r2=r+(25+70*p.w)*(1-u);
      const al=Math.min(1,u*4)*(0.25+0.35*p.w)*on;c.strokeStyle=p.col>0.72?`rgba(255,255,255,${al})`:`rgba(255,${185+p.col*65|0},70,${al})`;c.lineWidth=p.w;
      c.beginPath();c.moveTo(CX+Math.cos(p.a)*r,TY+Math.sin(p.a)*r);c.lineTo(CX+Math.cos(p.a)*r2,TY+Math.sin(p.a)*r2);c.stroke();}
    c.restore();}
  const ORB=[{rot:-0.42,sp:2.4,ph:0.3},{rot:0.68,sp:-1.9,ph:2.1},{rot:1.78,sp:1.6,ph:4.2}];
  const od=ez(t,0.45,1.25,E.ioC);
  const orbit=(o,front)=>{if(od<=0)return;const rx=390,ry=120+18*Math.sin(t*1.4+o.ph),rot=o.rot+t*0.14;
    c.save();c.translate(CX,TY);c.rotate(rot);c.lineWidth=front?1.8:1.2;c.strokeStyle=front?'rgba(255,225,130,0.75)':'rgba(255,200,90,0.28)';
    const end=TAU*od,a0=front?0:Math.PI,a1=front?Math.PI:TAU;const s=a0,e=Math.min(a1,end);if(e>s){c.beginPath();c.ellipse(0,0,rx,ry,0,s,e);c.stroke();}
    const th=t*o.sp+o.ph;const sn=Math.sin(th);if((sn>0)===front&&od>0.6){const ex=Math.cos(th)*rx,ey=sn*ry;c.restore();
      const px=CX+ex*Math.cos(rot)-ey*Math.sin(rot),py=TY+ex*Math.sin(rot)+ey*Math.cos(rot);glowDot(c,px,py,front?5:3.5,'rgba(255,220,90,1)',front?1:0.6);return;}
    c.restore();};
  for(const o of ORB)orbit(o,false);
  // element tile
  const tp=rng(t,0.3,0.8);if(tp>0){const ts=0.25+0.75*E.outB2(tp);c.save();c.translate(CX,TY);c.scale(ts,ts);c.globalAlpha=clamp(tp*5);
    radial(c,0,0,330,'rgba(255,190,40,0.35)');
    c.beginPath();c.roundRect(-150,-150,300,300,26);c.fillStyle='rgba(22,16,4,0.93)';c.fill();
    const bg=c.createLinearGradient(-150,-150,150,150);bg.addColorStop(0,'#fff0a0');bg.addColorStop(0.5,'#ffc61a');bg.addColorStop(1,'#e88a00');c.strokeStyle=bg;c.lineWidth=3.5;c.stroke();
    c.beginPath();c.roundRect(-136,-136,272,272,18);c.strokeStyle='rgba(255,210,90,0.18)';c.lineWidth=1;c.stroke();
    const sg=c.createLinearGradient(0,-90,0,70);sg.addColorStop(0,'#fff7c8');sg.addColorStop(0.45,'#ffd21f');sg.addColorStop(1,'#f08c00');
    setF(c,900,212,F.num);c.textAlign='center';c.fillStyle=sg;c.fillText('S',0,72);
    txt(c,'16',-122,-98,{w:700,s:40,fam:F.num,color:'#fff'});
    mono(c,'32.06',122,-102,{s:20,color:'rgba(255,220,140,0.8)',align:'right',ls:1});
    txt(c,'硫',-122,124,{w:900,s:38,color:'#fff'});mono(c,'SULFUR',122,118,{s:16,color:'rgba(255,220,140,0.8)',align:'right',ls:4});
    // shine sweep
    const sh=rng(t,0.75,1.25);if(sh>0&&sh<1){c.save();c.beginPath();c.roundRect(-150,-150,300,300,26);c.clip();c.globalCompositeOperation='lighter';
      const sx=lerp(-420,420,E.ioC(sh));const g=c.createLinearGradient(sx-80,0,sx+80,0);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(0.5,'rgba(255,245,210,0.35)');g.addColorStop(1,'rgba(255,255,255,0)');
      c.setTransform(c.getTransform().multiply(new DOMMatrix().skewXSelf(-20)));c.fillStyle=g;c.fillRect(-600,-200,1200,400);c.restore();}
    c.restore();
    // corner ticks around tile
    brackets(c,CX-196,TY-196,392,392,30,ez(t,0.55,1.0),'rgba(255,214,90,0.6)',2);}
  for(const o of ORB)orbit(o,true);
  c.restore();
  // type
  const out=rng(t,1.95,2.3);
  label(c,'ELEMENT No.16  ·  SULFUR  ·  S',CX,790,t-0.85,{s:17,color:'rgba(255,212,100,0.85)',align:'center',ls:6,out});
  reveal(c,'从一粒硫出发',CX,888,t-1.0,{s:92,ls:18,align:'center',st:0.06,dur:0.65,out});
}

// =====================================================================
// SCENE 2 — SINCE 2008 · HENGYANG  (2.5 – 5.0)
// =====================================================================
const S2T={x:1300,y:560};
const S2CITY=[...Array(420)].map((_,i)=>{const a=hash(i*3.1)*TAU,r=Math.pow(hash(i*5.7),0.55)*1500;return{x:Math.cos(a)*r,y:Math.sin(a)*r*0.8,s:hash(i*9.3)};});
const RIVER=[[-1500,-1050],[-900,-640],[-520,-300],[-260,-170],[-120,-30],[40,90],[220,170],[480,360],[800,700],[1300,1150]];
function riverPts(z){const a=[];for(let i=0;i<RIVER.length-1;i++){const[p0,p1]=[RIVER[i],RIVER[i+1]];for(let k=0;k<12;k++){const u=k/12;const w=Math.sin((i+u)*1.7)*60;a.push([S2T.x+(lerp(p0[0],p1[0],u)+w)*z,S2T.y+(lerp(p0[1],p1[1],u)-w*0.5)*z]);}}return a;}
function rollDigits(c,str,x,y,t,o){setF(c,o.w,o.s,o.fam);c.textAlign='center';c.letterSpacing='0px';const slot=c.measureText('0').width*0.98;const lh=o.s*0.9;
  c.save();c.beginPath();c.rect(x-20,y-o.s*0.82,slot*str.length+40,o.s*0.92);c.clip();c.fillStyle=o.fill;
  for(let i=0;i<str.length;i++){const st=i*o.st;const p=E.outX(rng(t,st,st+o.dur));if(t<st-0.05)continue;const d=+str[i];const total=o.spins[i]*10+d;const pos=p*total;const b=Math.floor(pos),fr=pos-b;
    c.globalAlpha=clamp((t-st+0.05)*8);for(const k of [0,1]){const dd=(b+k)%10;c.fillText(String(dd),x+slot*(i+0.5),y+(k-fr)*lh);}}
  c.restore();return slot*str.length;}
function S2(c,t){
  bgBase(c,'#020814');
  const zp=E.outQn(rng(t,-0.1,1.55));const z=lerp(0.3,1,zp);

  for(const[col,dx] of [['#f00',off],['#0f0',0],['#00f',-off]]){tm2.setTransform(1,0,0,1,0,0);tm2.globalCompositeOperation='source-over';tm2.drawImage(src,0,0);tm2.globalCompositeOperation='multiply';tm2.fillStyle=col;tm2.fillRect(0,0,W,H);tm2.globalCompositeOperation='source-over';dst.drawImage(TMP2,dx,0);}dst.restore();}
function bandWipe(dst,A,B,p){ // A outgoing, B incoming (revealed behind band, left side)
  const sk=0.238,bw=320;const xc=lerp(-bw-400,W+bw+500,p);const xe=(y,o)=>xc+o-sk*(y-CY);

  dst.save();dst.beginPath();dst.moveTo(xe(-10,-bw/2),-10);dst.lineTo(xe(-10,bw/2),-10);dst.lineTo(xe(H+10,bw/2),H+10);dst.lineTo(xe(H+10,-bw/2),H+10);dst.closePath();
  dst.fillStyle=brandGrad(dst,xc-bw/2,0,xc+bw/2,0);dst.fill();
  for(let i=0;i<34;i++){const y=hash(i*4.7)*H,o=bw/2+20+Math.pow(hash(i*9.1),1.6)*420,s=26+hash(i*2.2)*58;const x=xe(y,o);dst.fillStyle=gcol(0.7+hash(i)*0.3,0.55+0.45*hash(i*3));para(dst,x,y,s,s*0.62);dst.fill();}
  for(let i=0;i<14;i++){const y=hash(i*6.1+3)*H,o=bw/2-30-hash(i*5.3)*120,s=26+hash(i*2.9)*40;const x=xe(y,o);dst.fillStyle='#02070f';para(dst,x,y,s,s*0.62);dst.fill();}
  dst.restore();}
function glitch(dst,A,B,t,t0){ // slices mixing A (before) and B (after)
  const q=Math.floor(t*30);dst.drawImage(t<t0?A:B,0,0);const n=14;
  for(let i=0;i<n;i++){const r=hash(i*7.7+q*3.3);if(r<0.45)continue;const y=Math.floor(hash(i*3.1+q)*H),h=8+hash(i*5.9+q)*110,dx=(hash(i*2.3+q*1.7)-0.5)*260;const src=hash(i+q*9.1)<(t<t0?0.35:0.65)?B:A;dst.drawImage(src,0,y,W,h,dx,y,W,h);}
}
function renderFrame(gt){

    else zoomBlur(o,LA,zb,CX,CY);}

  else if(gt<19.0){drawScene(la,6,gt-17.0);if(gt<17.2){drawScene(lb,5,gt-13.5);glitch(o,LB,LA,gt,17.0);}else if(gt>=18.82){drawScene(lb,7,gt-19.0);const p=E.ioC(rng(gt,18.82,19.18));const dx=-W*p;o.fillStyle='#000';o.fillRect(0,0,W,H);const v=Math.sin(p*Math.PI)*420;hBlur(o,LA,dx,v);hBlur(o,LB,dx+W,v);}else o.drawImage(LA,0,0);}
  else{const lt=gt-19.0;drawScene(la,7,lt);if(gt<19.18){drawScene(lb,6,gt-17.0);const p=E.ioC(rng(gt,18.82,19.18));const dx=-W*p;o.fillStyle='#000';o.fillRect(0,0,W,H);const v=Math.sin(p*Math.PI)*420;hBlur(o,LB,dx,v);hBlur(o,LA,dx+W,v);}else o.drawImage(LA,0,0);}

  X.drawImage(VIG,0,0);X.save();X.globalCompositeOperation='overlay';X.globalAlpha=0.07;X.drawImage(GRAIN[Math.floor(gt*30)%3],0,0,W,H);X.restore();

  const fo=Math.max(1-rng(gt,0,0.12),rng(gt,24.55,25.0));if(fo>0){X.fillStyle=`rgba(0,0,0,${E.inQ(fo)})`;X.fillRect(0,0,W,H);}
}
window.renderFrame=renderFrame;
(async()=>{
  const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
  const fams=['900 100px "Noto Sans CJK SC"','700 100px "Noto Sans CJK SC"','500 100px "Noto Sans CJK SC"','400 100px "Noto Sans CJK SC"','300 100px "Noto Sans CJK SC"','800 100px "Noto Sans CJK SC"',
    '900 100px "Inter Display"','800 100px "Inter Display"','700 100px "Inter Display"','700 20px "DejaVu Sans Mono"','500 20px "DejaVu Sans Mono"'];
  let elapsed=0,previous=performance.now(),lastPaint=0,animationFrame;
  renderFrame(reducedMotion.matches?23.5:0.01);
  await Promise.all(fams.map(f=>document.fonts.load(f,'恒光化工湖南有限公司0123456789ABC')));
  if(reducedMotion.matches){renderFrame(23.5);return;}
  function tick(now){
    const delta=Math.max(0,Math.min((now-previous)/1000,0.1));
    previous=now;
    if(!document.hidden){
      elapsed=Math.min(DUR-1/60,elapsed+delta);
      if(now-lastPaint>=1000/30){renderFrame(elapsed);lastPaint=now;}
    }
    if(elapsed<DUR-1/60)animationFrame=requestAnimationFrame(tick);
  }
  previous=performance.now();
  animationFrame=requestAnimationFrame(tick);
  document.addEventListener('visibilitychange',()=>{previous=performance.now();});
  addEventListener('pagehide',()=>cancelAnimationFrame(animationFrame));
})();
