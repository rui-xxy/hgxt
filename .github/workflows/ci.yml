name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: lint + typecheck + test + build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hgxt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # API 集成测试连接 CI 的 postgres service（本地开发默认是 5433，由 vitest.config 兜底）
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hgxt_test?schema=public
      JWT_ACCESS_SECRET: ci-jwt-access-secret-0123456789abcdef0123456789

    steps:
      - uses: actions/checkout@v4

      # pnpm 版本由 package.json 的 packageManager 决定（action v4 不允许两处同时指定）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: pnpm check（lint + typecheck + test + build）
        run: pnpm check
